# Chunking Strategy Configuration

strategy: "hybrid"  # semantic, sliding_window, hybrid

semantic_chunking:
  respect_boundaries:
    - "paragraph"
    - "section"
    - "sentence"
  min_chunk_size: 40  # tokens
  max_chunk_size: 300  # tokens — small enough that a chunk's line range is
                        # a handful of lines, not most of a page (see
                        # citations: line-level precision needs chunks this
                        # size; 1024 tokens routinely spans 40+ lines)

sliding_window:
  chunk_size: 300  # tokens
  overlap: 0.2  # 20% overlap

hybrid:
  primary: "semantic"
  fallback: "sliding_window"
  max_chunk_size: 300
  overlap: 0.2

special_handling:
  preserve_tables: true
  preserve_lists: true
  preserve_code_blocks: true
  keep_headers_with_content: true

metadata:
  include_page_numbers: true
  include_section_titles: true
  include_document_metadata: true
  include_position: true  # chunk index within document
