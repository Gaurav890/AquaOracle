<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AquaOracle</title>
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-brand"><span class="accent">&gt;</span> AquaOracle</div>
        <button class="btn btn-secondary new-chat-btn" id="new-chat-btn">+ New chat</button>
      </div>
      <div class="chat-list" id="chat-list"></div>
      <div class="sidebar-footer">
        <span id="user-email"></span>
        <div class="sidebar-footer-actions">
          <button class="btn btn-sm" id="settings-btn">Settings</button>
          <button class="btn btn-sm" id="logout-btn">Log out</button>
        </div>
      </div>
    </aside>

    <main class="chat-main">
      <div class="chat-topbar">
        <input type="text" class="chat-title-input" id="chat-title-input" placeholder="New chat" disabled />
        <div class="chat-topbar-actions">
          <span class="provider-badge" id="provider-badge">OLLAMA</span>
          <button class="btn btn-secondary" id="docs-toggle-btn" disabled>Documents</button>
        </div>
      </div>

      <div class="messages" id="messages">
        <div class="empty-state" id="empty-state">Select a chat or start a new one to begin.</div>
      </div>

      <div class="composer">
        <div class="composer-inner">
          <textarea
            class="composer-input"
            id="composer-input"
            rows="1"
            placeholder="Ask a question..."
            disabled
          ></textarea>
          <button class="btn btn-primary composer-send" id="send-btn" disabled>Send</button>
        </div>
      </div>
    </main>

    <aside class="doc-drawer" id="doc-drawer">
      <div class="doc-drawer-header">
        <span>Documents in this chat</span>
        <button class="btn" id="doc-drawer-close">&times;</button>
      </div>
      <div class="doc-drawer-list" id="doc-drawer-list"></div>
      <div class="doc-drawer-upload">
        <label class="upload-zone" id="upload-zone">
          <input type="file" id="upload-input" accept="application/pdf" hidden />
          <span id="upload-label">Drop a PDF here or click to upload</span>
        </label>
        <label class="share-checkbox">
          <input type="checkbox" id="upload-share-checkbox" />
          Also add to my shared knowledge base
        </label>
      </div>
    </aside>
  </div>

  <div class="modal-overlay" id="settings-modal">
    <div class="modal">
      <div class="modal-header">
        <h2>Settings</h2>
        <button id="settings-modal-close">&times;</button>
      </div>
      <div class="modal-body" id="settings-modal-body">
        <div class="provider-row">
          <div>
            <div class="provider-row-name">Ollama</div>
            <div class="provider-row-status configured">Local, no key needed</div>
          </div>
        </div>
        <div class="provider-row" data-provider="openai">
          <div>
            <div class="provider-row-name">OpenAI</div>
            <div class="provider-row-status" data-status>Not configured</div>
          </div>
          <div class="provider-row-actions" data-actions></div>
        </div>
        <div class="provider-row" data-provider="anthropic">
          <div>
            <div class="provider-row-name">Anthropic</div>
            <div class="provider-row-status" data-status>Not configured</div>
          </div>
          <div class="provider-row-actions" data-actions></div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="provider-modal">
    <div class="modal">
      <div class="modal-header">
        <h2>Chat provider</h2>
        <button id="provider-modal-close">&times;</button>
      </div>
      <div class="modal-body">
        <div class="field">
          <label class="field-label" for="provider-select">Provider</label>
          <select id="provider-select">
            <option value="ollama">Ollama (local)</option>
            <option value="openai">OpenAI</option>
            <option value="anthropic">Anthropic</option>
          </select>
        </div>
        <div class="field">
          <label class="field-label" for="provider-model-input">Model (optional — leave blank for default)</label>
          <input type="text" id="provider-model-input" placeholder="e.g. gpt-4o, claude-sonnet-5" />
        </div>
        <div class="error-text" id="provider-modal-error" style="display: none"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="provider-modal-cancel">Cancel</button>
        <button class="btn btn-primary" id="provider-modal-save">Save</button>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/sidebar.js"></script>
  <script src="/js/chat.js"></script>
  <script src="/js/documents.js"></script>
  <script src="/js/settings.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
