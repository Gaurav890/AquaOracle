<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AquaOracle</title>
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-brand"><span class="accent">&gt;</span> AquaOracle</div>
      <div class="auth-subtitle">Local retrieval-augmented Q&amp;A over your documents.</div>

      <div class="auth-tabs">
        <div class="auth-tab active" data-tab="login">Log in</div>
        <div class="auth-tab" data-tab="signup">Sign up</div>
      </div>

      <div class="auth-error error-text" id="auth-error"></div>

      <form id="login-form">
        <div class="auth-field">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" required autocomplete="email" />
        </div>
        <div class="auth-field">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" required autocomplete="current-password" />
        </div>
        <button type="submit" class="btn btn-primary auth-submit">Log in</button>
      </form>

      <form id="signup-form" style="display: none">
        <div class="auth-field">
          <label for="signup-name">Name (optional)</label>
          <input type="text" id="signup-name" autocomplete="name" />
        </div>
        <div class="auth-field">
          <label for="signup-email">Email</label>
          <input type="email" id="signup-email" required autocomplete="email" />
        </div>
        <div class="auth-field">
          <label for="signup-password">Password</label>
          <input type="password" id="signup-password" required minlength="8" autocomplete="new-password" />
        </div>
        <button type="submit" class="btn btn-primary auth-submit">Create account</button>
      </form>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
